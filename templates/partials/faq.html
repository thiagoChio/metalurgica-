<section class="section section--light" id="faq">
  <div class="shell shell--narrow">
    <div class="section-head">
      <p class="eyebrow">Dúvidas frequentes</p>
      <h2 data-reveal>O que perguntam antes de fechar.</h2>
    </div>

    <div class="faq" data-accordion>
      {% for item in content.faq %}
      <div class="faq__item">
        <h3>
          <button class="faq__trigger" type="button"
                  id="faq-btn-{{ loop.index }}"
                  aria-expanded="false" aria-controls="faq-panel-{{ loop.index }}">
            {{ item.question }}
            <span class="faq__icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
          </button>
        </h3>
        <div class="faq__panel" id="faq-panel-{{ loop.index }}" role="region"
             aria-labelledby="faq-btn-{{ loop.index }}">
          <div><p>{{ item.answer }}</p></div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
