# Configuração de publicação no Render (render.com).
# O Render lê este arquivo sozinho e monta o serviço — você não precisa
# preencher nada na mão além das variáveis marcadas como sync: false.
services:
  - type: web
    name: correa-metalurgica
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Modo apresentação: esconde os lembretes de obra.
      - key: SITE_DEBUG
        value: "false"
      # Preencha no painel do Render se quiser receber os orçamentos por e-mail.
      # Sem isso o pedido só aparece no log — e o disco do plano grátis é
      # apagado a cada reinício, então NÃO confie nele para guardar lead.
      - key: SITE_SMTP_HOST
        sync: false
      - key: SITE_SMTP_PORT
        sync: false
      - key: SITE_SMTP_USER
        sync: false
      - key: SITE_SMTP_PASSWORD
        sync: false
      - key: SITE_NOTIFY_TO
        sync: false
